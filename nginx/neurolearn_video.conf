events {
}

http {
    include C:/nginx-1.30.0/conf/mime.types;

    server {
        listen 18080 default_server;
        server_name _;

        # ==============================
        # Next.js static assets — safe to cache aggressively, these are
        # content-hashed and never contain per-user data.
        # ==============================
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ==============================
        # Next.js frontend (pages) — every page here is gated by
        # RouteGuard client-side (see frontend/components/RouteGuard.tsx),
        # but a shared/kiosk machine or an intermediate cache must never
        # be allowed to serve one visitor's already-rendered authenticated
        # page (leaderboard, dashboard, etc.) to the next visitor who
        # loads the same URL. Explicit no-store, not just "no directive".
        # ==============================
        location / {
            proxy_pass http://127.0.0.1:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            add_header Cache-Control "no-store, must-revalidate" always;
        }

        # ==============================
        # FastAPI backend
        #
        # client_max_body_size / proxy_request_buffering / timeouts here
        # specifically account for POST /api/courses/import: nginx's
        # DEFAULT client_max_body_size is 1MB, which is why a course
        # folder upload of any real size returns 413 — a single lecture
        # video alone is usually well over that. "0" means no limit;
        # relying on disk space and the admin's own judgment to bound
        # this, not an arbitrary nginx number that would need bumping
        # again for the next longer course.
        #
        # proxy_request_buffering off: without this, nginx buffers the
        # ENTIRE request body to a temp file on disk before forwarding
        # even the first byte to FastAPI — for a 10s-of-GB folder that's
        # a slow, disk-heavy extra copy for no benefit. Streaming it
        # straight through means FastAPI starts receiving (and this
        # conf's upload progress bar on the admin page starts moving)
        # immediately.
        #
        # The long timeouts are for the same reason: a large upload over
        # a real network takes a while, and nginx's default 60s proxy
        # timeouts would otherwise kill it partway through.
        # ==============================
        location /api/ {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 0;
            proxy_request_buffering off;

            client_body_timeout 3600s;
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ==============================
        # NeuroLearn local videos
        # ==============================
        location /media/ {
            alias D:/GithubRepositories/NeuroLearn_V2/videos/;

            add_header Accept-Ranges bytes always;

            limit_except GET HEAD OPTIONS {
                deny all;
            }

            autoindex off;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;

            sendfile on;
            tcp_nopush on;
            output_buffers 2 512k;

            add_header Cache-Control "public, max-age=3600";
        }

        location = /media {
            return 404;
        }

        # ==============================
        # NeuroLearn-specific logs
        # ==============================
        access_log D:/GithubRepositories/NeuroLearn_V2/nginx/logs/neurolearn_nginx_access.log;
        error_log D:/GithubRepositories/NeuroLearn_V2/nginx/logs/neurolearn_nginx_error.log;
    }
}